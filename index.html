<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkFart</title>
  <link rel="icon" id="favicon" type="image/gif" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b0b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8e8;
      gap: clamp(12px, 3vh, 40px);
      padding: clamp(12px, 2vh, 32px) 16px;
      overflow-x: hidden;
    }

    .dog-container {
      position: relative;
      width: min(480px, 80vw, 50vh);
      aspect-ratio: 1;
    }

    .dog-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.08s ease-in;
    }

    .dog-container img.visible {
      opacity: 1;
      transition: opacity 0.08s ease-in;
    }

    .dog-container img.fading {
      opacity: 0;
      transition: opacity 1.2s ease-out;
    }

    .controls {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    button {
      padding: 14px 44px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    #startBtn {
      background: #e8e8e8;
      color: #0b0b0b;
      box-shadow: 0 0 0 0 rgba(232,232,232,0.3);
    }

    #startBtn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(232,232,232,0.2);
    }

    #startBtn:not(:disabled):active { transform: translateY(0); }

    #stopBtn {
      background: transparent;
      color: #e8e8e8;
      border: 2px solid rgba(232,232,232,0.25);
    }

    #stopBtn:not(:disabled):hover {
      border-color: rgba(232,232,232,0.6);
      transform: translateY(-2px);
    }

    #stopBtn:not(:disabled):active { transform: translateY(0); }

    #askBtn {
      background: transparent;
      color: rgba(232,232,232,0.5);
      border: 2px solid rgba(232,232,232,0.15);
      padding: 10px 28px;
      font-size: 1.1rem;
    }

    #askBtn:not(:disabled):hover {
      border-color: rgba(232,232,232,0.4);
      color: #e8e8e8;
      transform: translateY(-2px);
    }

    #askBtn:not(:disabled):active { transform: translateY(0); }

    #askBtn:disabled { opacity: 0.25; cursor: not-allowed; transform: none !important; }

    .status {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232,232,232,0.3);
      height: 1.2em;
      transition: color 0.3s;
    }

    .status.active { color: rgba(232,232,232,0.55); }

    .tick-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 8px;
      vertical-align: middle;
      animation: pulse 1s infinite;
    }

    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      color: rgba(232,232,232,0.35);
    }

    .credit {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: rgba(232,232,232,0.2);
    }

    .counter {
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      color: rgba(232,232,232,0.3);
    }

    .counter span {
      color: #e8e8e8;
      font-weight: 600;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(232,232,232,0.45);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      position: relative;
    }

    #volumeSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: rgba(232,232,232,0.2);
      outline: none;
      cursor: pointer;
    }

    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e8e8e8;
      cursor: pointer;
    }

    #volumeSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e8e8e8;
      border: none;
      cursor: pointer;
    }

    .pw-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #161616;
      border: 1px solid rgba(232,232,232,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      z-index: 10;
    }

    .pw-box.open { display: flex; }

    .pw-box p {
      font-size: 0.8rem;
      color: rgba(232,232,232,0.55);
      letter-spacing: 0.04em;
    }

    .pw-box input {
      background: rgba(232,232,232,0.06);
      border: 1px solid rgba(232,232,232,0.15);
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 0.9rem;
      padding: 7px 12px;
      width: 140px;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
      transition: border-color 0.2s;
    }

    .pw-box input:focus { border-color: rgba(232,232,232,0.4); }

    .pw-box input.wrong {
      border-color: rgba(255,80,80,0.6);
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* angry state */
    body {
      transition: background 0.6s ease;
    }

    body.angry {
      background: #1a0000;
    }

    .dog-container img.angry {
      opacity: 1 !important;
      filter: sepia(1) saturate(10) hue-rotate(310deg) brightness(0.85);
      transition: filter 0.4s ease, opacity 0.08s ease-in !important;
    }

    .hungry-text {
      display: none;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      color: #ff2222;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000;
      animation: glow-pulse 0.8s ease-in-out infinite;
      text-align: center;
    }

    .hungry-text.visible { display: block; }

    @keyframes glow-pulse {
      0%, 100% { text-shadow: 0 0 10px #ff2222, 0 0 30px #ff0000, 0 0 60px #ff0000; }
      50%       { text-shadow: 0 0 20px #ff5555, 0 0 60px #ff2222, 0 0 100px #ff0000; }
    }

    .cookie-btn {
      display: none;
      width: clamp(70px, 15vw, 110px);
      cursor: pointer;
      animation: cookie-bounce 0.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 12px rgba(255,150,0,0.6));
    }

    .cookie-btn.visible { display: block; }

    @keyframes cookie-bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-10px) scale(1.08); }
    }
  </style>
</head>
<body>

  <p class="tagline">every second there's a 1/10 chance for bark fart</p>
  <p class="credit">made with love by OLLY</p>

  <p class="hungry-text" id="hungryText">HE IS HUNGRY</p>

  <div class="dog-container">
    <img id="dog" src="dog.webp" alt="Dog" />
  </div>

  <img src="cookie.png" alt="Cookie" class="cookie-btn" id="cookieBtn" />

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <button id="askBtn">?</button>

  <div class="status" id="status">idle</div>

  <p class="counter">You have suffered through <span id="barkCount">0</span> BarkFarts</p>

  <div class="volume-row">
    <span>vol</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
    <div class="pw-box" id="pwBox">
      <p id="pwPrompt">what's the magic word?</p>
      <input type="text" id="pwInput" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <audio id="sfx" src="sfx.mp3" preload="auto"></audio>

  <script>
    const CHANCE_PER_SECOND = 1 / 10;

    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const status   = document.getElementById('status');
    const sfx      = document.getElementById('sfx');
    const dog      = document.getElementById('dog');

    let intervalId = null;
    let tick = 0;

    const barkCount = document.getElementById('barkCount');
    let barkTotal = 0;

    const favicon = document.getElementById('favicon');
    const BLANK_ICON = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    let fadeTimer = null;
    let titleTimer1 = null;
    let titleTimer2 = null;

    let isAngry = false;

    function flashDog() {
      barkCount.textContent = ++barkTotal;
      setVolume(Math.min(1, parseFloat(volumeSlider.value) + 0.05));
      clearTimeout(fadeTimer);
      clearTimeout(titleTimer1);
      clearTimeout(titleTimer2);

      dog.classList.remove('fading');
      dog.classList.add('visible');
      favicon.href = 'favicon.webp';
      document.title = 'BARK';

      titleTimer1 = setTimeout(() => { document.title = 'FART'; }, 500);

      if (!isAngry) {
        fadeTimer = setTimeout(() => {
          dog.classList.remove('visible');
          dog.classList.add('fading');
        }, 400);
      }

      titleTimer2 = setTimeout(() => {
        document.title = 'BarkFart';
        favicon.href = BLANK_ICON;
      }, 1000);
    }

    function setStatus(text, active = false) {
      status.innerHTML = active
        ? `<span class="tick-dot"></span>${text}`
        : text;
      status.className = 'status' + (active ? ' active' : '');
    }

    startBtn.addEventListener('click', () => {
      tick = 0;
      startBtn.disabled = true;
      stopBtn.disabled  = false;
      setStatus('running', true);

      intervalId = setInterval(() => {
        tick++;
        const roll = Math.random();
        if (tick === 1 || roll < CHANCE_PER_SECOND) {
          sfx.currentTime = 0;
          sfx.play();
          flashDog();
          setStatus(`tick ${tick} — bark!`, true);
        } else {
          setStatus(`tick ${tick}`, true);
        }
      }, 1000);
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(intervalId);
      intervalId = null;
      startBtn.disabled = false;
      stopBtn.disabled  = true;
      setStatus('stopped');
    });

    const askBtn = document.getElementById('askBtn');

    function triggerOnce(cb) {
      sfx.currentTime = 0;
      sfx.play();
      flashDog();
      if (cb) setTimeout(cb, 900);
    }

    const volumeSlider = document.getElementById('volumeSlider');
    const pwBox        = document.getElementById('pwBox');
    const pwPrompt     = document.getElementById('pwPrompt');
    const pwInput      = document.getElementById('pwInput');
    let volumeUnlocked = false;
    let firstUnlock    = true;
    let mathAnswer     = null;

    function randTwoDigit() {
      return Math.floor(Math.random() * 90) + 10;
    }

    volumeSlider.addEventListener('mousedown', interceptVolume);
    volumeSlider.addEventListener('touchstart', interceptVolume, { passive: false });

    function interceptVolume(e) {
      if (volumeUnlocked) return;
      e.preventDefault();
      pwInput.value = '';
      pwInput.classList.remove('wrong');
      if (firstUnlock) {
        pwPrompt.textContent = "what's the magic word?";
        mathAnswer = null;
      } else {
        const a = randTwoDigit(), b = randTwoDigit();
        mathAnswer = a * b;
        pwPrompt.textContent = `what's ${a} x ${b}?`;
      }
      pwBox.classList.add('open');
      setTimeout(() => pwInput.focus(), 50);
    }

    let relockTimer = null;

    pwInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = pwInput.value.trim();
      const correct = firstUnlock
        ? val.toLowerCase() === 'please'
        : parseInt(val, 10) === mathAnswer;

      if (correct) {
        volumeUnlocked = true;
        firstUnlock    = false;
        pwBox.classList.remove('open');
        clearTimeout(relockTimer);
        relockTimer = setTimeout(() => {
          volumeUnlocked = false;
        }, 10000);
      } else {
        pwInput.classList.remove('wrong');
        void pwInput.offsetWidth;
        pwInput.classList.add('wrong');
        pwInput.value = '';
      }
    });

    function setVolume(v) {
      sfx.volume = v;
      volumeSlider.value = v;
    }

    setVolume(1);

    volumeSlider.addEventListener('input', () => {
      lastUserInput = Date.now();
      setVolume(parseFloat(volumeSlider.value));
    });

    let lastUserInput = 0;

    const hungryText = document.getElementById('hungryText');
    const cookieBtn  = document.getElementById('cookieBtn');
    let angryBarkInterval = null;
    let angryTimer = null;

    function scheduleAngry() {
      clearTimeout(angryTimer);
      const delay = (4 + Math.random() * 2) * 60 * 1000;
      angryTimer = setTimeout(startAngry, delay);
    }

    function startAngry() {
      isAngry = true;
      document.body.classList.add('angry');
      dog.classList.add('angry', 'visible');
      dog.classList.remove('fading');
      hungryText.classList.add('visible');
      cookieBtn.classList.add('visible');
      angryBarkInterval = setInterval(() => {
        sfx.currentTime = 0;
        sfx.play();
        flashDog();
      }, 1200);
    }

    function feedDog() {
      isAngry = false;
      document.body.classList.remove('angry');
      dog.classList.remove('angry', 'visible');
      dog.classList.add('fading');
      hungryText.classList.remove('visible');
      cookieBtn.classList.remove('visible');
      clearInterval(angryBarkInterval);
      scheduleAngry();
    }

    cookieBtn.addEventListener('click', feedDog);

    scheduleAngry();

    askBtn.addEventListener('click', () => {
      askBtn.disabled  = true;
      startBtn.disabled = true;
      setStatus('thinking...', true);

      setTimeout(() => {
        const twice = Math.random() < 0.5;
        if (twice) {
          triggerOnce(() => triggerOnce(() => {
            askBtn.disabled  = false;
            startBtn.disabled = !!intervalId;
            setStatus('idle');
          }));
        } else {
          triggerOnce(() => {
            askBtn.disabled  = false;
            startBtn.disabled = !!intervalId;
            setStatus('idle');
          });
        }
      }, 3000);
    });
  </script>

</body>
</html>
