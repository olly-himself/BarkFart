<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BarkFart</title>
  <link rel="icon" id="favicon" type="image/gif" href="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0b0b0b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e8e8e8;
      gap: clamp(12px, 3vh, 40px);
      padding: clamp(12px, 2vh, 32px) 16px;
      overflow-x: hidden;
    }

    .dog-container {
      position: relative;
      width: min(480px, 80vw, 50vh);
      aspect-ratio: 1;
    }

    .dog-container img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0;
      transition: opacity 0.08s ease-in;
    }

    .dog-container img.visible {
      opacity: 1;
      transition: opacity 0.08s ease-in;
    }

    .dog-container img.fading {
      opacity: 0;
      transition: opacity 1.2s ease-out;
    }

    .controls {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    button {
      padding: 14px 44px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.2s;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
    }

    #startBtn {
      background: #e8e8e8;
      color: #0b0b0b;
      box-shadow: 0 0 0 0 rgba(232,232,232,0.3);
    }

    #startBtn:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(232,232,232,0.2);
    }

    #startBtn:not(:disabled):active { transform: translateY(0); }

    #stopBtn {
      background: transparent;
      color: #e8e8e8;
      border: 2px solid rgba(232,232,232,0.25);
    }

    #stopBtn:not(:disabled):hover {
      border-color: rgba(232,232,232,0.6);
      transform: translateY(-2px);
    }

    #stopBtn:not(:disabled):active { transform: translateY(0); }

    #askBtn {
      background: transparent;
      color: rgba(232,232,232,0.5);
      border: 2px solid rgba(232,232,232,0.15);
      padding: 10px 28px;
      font-size: 1.1rem;
    }

    #askBtn:not(:disabled):hover {
      border-color: rgba(232,232,232,0.4);
      color: #e8e8e8;
      transform: translateY(-2px);
    }

    #askBtn:not(:disabled):active { transform: translateY(0); }

    #askBtn:disabled { opacity: 0.25; cursor: not-allowed; transform: none !important; }

    .status {
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(232,232,232,0.3);
      height: 1.2em;
      transition: color 0.3s;
    }

    .status.active { color: rgba(232,232,232,0.55); }

    .tick-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      margin-right: 8px;
      vertical-align: middle;
      animation: pulse 1s infinite;
    }

    .tagline {
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      color: rgba(232,232,232,0.35);
    }

    .credit {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: rgba(232,232,232,0.2);
    }

    .counter {
      font-size: 0.82rem;
      letter-spacing: 0.05em;
      color: rgba(232,232,232,0.3);
    }

    .counter span {
      color: #e8e8e8;
      font-weight: 600;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    .volume-row {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(232,232,232,0.45);
      font-size: 0.8rem;
      letter-spacing: 0.06em;
      position: relative;
    }

    #volumeSlider {
      -webkit-appearance: none;
      appearance: none;
      width: 160px;
      height: 4px;
      border-radius: 2px;
      background: rgba(232,232,232,0.2);
      outline: none;
      cursor: pointer;
    }

    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e8e8e8;
      cursor: pointer;
    }

    #volumeSlider::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #e8e8e8;
      border: none;
      cursor: pointer;
    }

    .pw-box {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #161616;
      border: 1px solid rgba(232,232,232,0.12);
      border-radius: 12px;
      padding: 14px 18px;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      z-index: 10;
    }

    .pw-box.open { display: flex; }

    .pw-box p {
      font-size: 0.8rem;
      color: rgba(232,232,232,0.55);
      letter-spacing: 0.04em;
    }

    .pw-box input {
      background: rgba(232,232,232,0.06);
      border: 1px solid rgba(232,232,232,0.15);
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 0.9rem;
      padding: 7px 12px;
      width: 140px;
      outline: none;
      text-align: center;
      letter-spacing: 0.1em;
      transition: border-color 0.2s;
    }

    .pw-box input:focus { border-color: rgba(232,232,232,0.4); }

    .pw-box input.wrong {
      border-color: rgba(255,80,80,0.6);
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    /* angry state */
    body {
      transition: background 0.6s ease;
    }

    body.angry {
      background: #1a0000;
    }

    .dog-container img.angry {
      opacity: 1 !important;
      filter: sepia(1) saturate(10) hue-rotate(310deg) brightness(0.85);
      transition: filter 0.4s ease, opacity 0.08s ease-in !important;
    }

    .hungry-text {
      display: none;
      font-size: clamp(1.4rem, 5vw, 2.2rem);
      font-weight: 900;
      letter-spacing: 0.2em;
      color: #ff2222;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #ff0000, 0 0 60px #ff0000;
      animation: glow-pulse 0.8s ease-in-out infinite;
      text-align: center;
    }

    .hungry-text.visible { display: block; }

    @keyframes glow-pulse {
      0%, 100% { text-shadow: 0 0 10px #ff2222, 0 0 30px #ff0000, 0 0 60px #ff0000; }
      50%       { text-shadow: 0 0 20px #ff5555, 0 0 60px #ff2222, 0 0 100px #ff0000; }
    }

    .cookie-btn {
      display: none;
      width: clamp(70px, 15vw, 110px);
      cursor: pointer;
      animation: cookie-bounce 0.5s ease-in-out infinite alternate;
      filter: drop-shadow(0 0 12px rgba(255,150,0,0.6));
    }

    .cookie-btn.visible { display: block; }

    /* cookie banner */
    .cookie-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #1a1a1a;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 0.82rem;
      color: rgba(232,232,232,0.6);
      z-index: 999;
    }

    .cookie-banner.hidden { display: none; }

    .cookie-banner button {
      padding: 6px 18px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: #e8e8e8;
      color: #0b0b0b;
      border: none;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      flex-shrink: 0;
    }

    .cookie-banner button:hover { background: #fff; }

    /* chat */
    .chat-wrap {
      width: min(560px, 92vw);
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .chat-log {
      height: 660px;
      overflow-y: auto;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .chat-log::-webkit-scrollbar { width: 4px; }
    .chat-log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

    .chat-msg {
      font-size: 0.82rem;
      line-height: 1.4;
      color: rgba(232,232,232,0.75);
      word-break: break-word;
    }

    .chat-msg .chat-author {
      color: #e8e8e8;
      font-weight: 600;
      margin-right: 6px;
    }

    .chat-bark {
      color: #ff2222;
      font-weight: 700;
      text-shadow: 0 0 8px #ff0000, 0 0 16px #ff0000;
    }

    .chat-image {
      display: block;
      max-width: 100%;
      max-height: 200px;
      border-radius: 6px;
      margin-top: 4px;
      object-fit: contain;
    }

    .chat-msg .chat-time {
      font-size: 0.68rem;
      color: rgba(232,232,232,0.2);
      margin-left: 6px;
    }

    .chat-input-row {
      display: flex;
      gap: 8px;
    }

    .chat-input-row input {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      color: #e8e8e8;
      font-size: 0.85rem;
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-row input:focus { border-color: rgba(255,255,255,0.3); }

    #chatName { width: 90px; flex-shrink: 0; }
    #chatMsg  { flex: 1; }

    #chatSend {
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      background: rgba(232,232,232,0.1);
      color: #e8e8e8;
      border: 1px solid rgba(232,232,232,0.15);
      flex-shrink: 0;
    }

    #chatSend:hover { background: rgba(232,232,232,0.18); }

    @keyframes cookie-bounce {
      from { transform: translateY(0) scale(1); }
      to   { transform: translateY(-10px) scale(1.08); }
    }
  </style>
</head>
<body>

  <div class="cookie-banner" id="cookieBanner">
    <span>🍪 This site uses cookies to enhance your BarkFart experience.</span>
    <button id="cookieAccept">Accept</button>
  </div>

  <p class="tagline">every second there's a 1/10 chance for bark fart</p>
  <p class="credit">made with love by OLLY</p>

  <p class="hungry-text" id="hungryText">HE IS HUNGRY</p>

  <div class="dog-container">
    <img id="dog" src="dog.webp" alt="Dog" />
  </div>

  <img src="cookie.png" alt="Cookie" class="cookie-btn" id="cookieBtn" />

  <div class="controls">
    <button id="startBtn">Start</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <button id="askBtn">?</button>

  <div class="status" id="status">idle</div>

  <p class="counter">You have suffered through <span id="barkCount">0</span> BarkFarts</p>

  <div class="volume-row">
    <span>vol</span>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" />
    <div class="pw-box" id="pwBox">
      <p id="pwPrompt">what's the magic word?</p>
      <input type="text" id="pwInput" autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div class="chat-wrap">
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatName" placeholder="name" maxlength="20" autocomplete="off" />
      <input type="text" id="chatMsg" placeholder="say something..." maxlength="200" autocomplete="off" />
      <button id="chatSend">Send</button>
    </div>
  </div>

  <audio id="sfx" src="sfx.mp3" preload="auto"></audio>

  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>

  <script>
    // ── PASTE YOUR FIREBASE CONFIG HERE ──────────────────────────────────────
    const firebaseConfig = {
      apiKey:            "AIzaSyDDZbnGpUfk1_wj5Alms7vg7DUQugolQ0s",
      authDomain:        "barkfartchat.firebaseapp.com",
      databaseURL:       "https://barkfartchat-default-rtdb.europe-west1.firebasedatabase.app",
      projectId:         "barkfartchat",
      storageBucket:     "barkfartchat.firebasestorage.app",
      messagingSenderId: "172648964862",
      appId:             "1:172648964862:web:6c3eab471dab977d9cbbaf"
    };
    // ─────────────────────────────────────────────────────────────────────────
    firebase.initializeApp(firebaseConfig);
    const db          = firebase.database();
    const messagesRef = db.ref('messages').limitToLast(500);

    const chatLog  = document.getElementById('chatLog');
    const chatName = document.getElementById('chatName');
    const chatMsg  = document.getElementById('chatMsg');
    const chatSend = document.getElementById('chatSend');

    const cookieBanner = document.getElementById('cookieBanner');
    if (localStorage.getItem('cookieAccepted')) cookieBanner.classList.add('hidden');
    document.getElementById('cookieAccept').addEventListener('click', () => {
      localStorage.setItem('cookieAccepted', '1');
      cookieBanner.classList.add('hidden');
    });

    chatName.value = localStorage.getItem('bfName') || '';

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function isImageUrl(text) {
      return /^https?:\/\/.+\.(jpg|jpeg|png|gif|webp|svg|bmp)(\?.*)?$/i.test(text.trim());
    }

    messagesRef.on('child_added', (snap) => {
      const { username, text, timestamp } = snap.val();
      const el = document.createElement('div');
      el.className = 'chat-msg';

      const author = document.createElement('span');
      author.className = 'chat-author';
      author.textContent = username + ':';

      const time = document.createElement('span');
      time.className = 'chat-time';
      time.textContent = formatTime(timestamp);

      el.appendChild(author);

      if (isImageUrl(text)) {
        const img = document.createElement('img');
        img.src = text.trim();
        img.className = 'chat-image';
        img.alt = 'image';
        img.onerror = () => { img.replaceWith(document.createTextNode(' [image failed to load]')); };
        el.appendChild(img);
      } else {
        const parts = (' ' + text).split(/(bark)/gi);
        parts.forEach(part => {
          if (/^bark$/i.test(part)) {
            const span = document.createElement('span');
            span.className = 'chat-bark';
            span.textContent = part;
            el.appendChild(span);
          } else {
            el.appendChild(document.createTextNode(part));
          }
        });
      }

      el.appendChild(time);
      chatLog.appendChild(el);
      chatLog.scrollTop = chatLog.scrollHeight;
    });

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // skip the first child_added which fires for the most recent existing trigger on load
    let triggerReady = false;
    db.ref('triggers').limitToLast(1).on('child_added', () => {
      if (!triggerReady) { triggerReady = true; return; }
      if (!isAngry) startAngry();
    });

    function sendChat() {
      const name = chatName.value.trim() || 'anon';
      const text = chatMsg.value.trim();
      if (!text) return;
      localStorage.setItem('bfName', name);
      db.ref('messages').push({ username: name, text, timestamp: firebase.database.ServerValue.TIMESTAMP });
      if (/bark/i.test(text)) {
        db.ref('triggers').push({ timestamp: firebase.database.ServerValue.TIMESTAMP });
      }
      chatMsg.value = '';
    }

    chatSend.addEventListener('click', sendChat);
    chatMsg.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
  </script>

  <script>
    const CHANCE_PER_SECOND = 1 / 10;

    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const status   = document.getElementById('status');
    const sfx      = document.getElementById('sfx');
    const dog      = document.getElementById('dog');

    let intervalId = null;
    let tick = 0;

    const barkCount = document.getElementById('barkCount');
    let barkTotal = 0;

    const favicon = document.getElementById('favicon');
    const BLANK_ICON = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

    let fadeTimer = null;
    let titleTimer1 = null;
    let titleTimer2 = null;

    let isAngry = false;

    function flashDog() {
      barkCount.textContent = ++barkTotal;
      setVolume(Math.min(1, parseFloat(volumeSlider.value) + 0.05));
      clearTimeout(fadeTimer);
      clearTimeout(titleTimer1);
      clearTimeout(titleTimer2);

      dog.classList.remove('fading');
      dog.classList.add('visible');
      favicon.href = 'favicon.webp';
      document.title = 'BARK';

      titleTimer1 = setTimeout(() => { document.title = 'FART'; }, 500);

      if (!isAngry) {
        fadeTimer = setTimeout(() => {
          dog.classList.remove('visible');
          dog.classList.add('fading');
        }, 400);
      }

      titleTimer2 = setTimeout(() => {
        document.title = 'BarkFart';
        favicon.href = BLANK_ICON;
      }, 1000);
    }

    function setStatus(text, active = false) {
      status.innerHTML = active
        ? `<span class="tick-dot"></span>${text}`
        : text;
      status.className = 'status' + (active ? ' active' : '');
    }

    startBtn.addEventListener('click', () => {
      tick = 0;
      startBtn.disabled = true;
      stopBtn.disabled  = false;
      setStatus('running', true);

      intervalId = setInterval(() => {
        tick++;
        const roll = Math.random();
        if (tick === 1 || roll < CHANCE_PER_SECOND) {
          sfx.currentTime = 0;
          sfx.play();
          flashDog();
          setStatus(`tick ${tick} — bark!`, true);
        } else {
          setStatus(`tick ${tick}`, true);
        }
      }, 1000);
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(intervalId);
      intervalId = null;
      startBtn.disabled = false;
      stopBtn.disabled  = true;
      setStatus('stopped');
    });

    const askBtn = document.getElementById('askBtn');

    function triggerOnce(cb) {
      sfx.currentTime = 0;
      sfx.play();
      flashDog();
      if (cb) setTimeout(cb, 900);
    }

    const volumeSlider = document.getElementById('volumeSlider');
    const pwBox        = document.getElementById('pwBox');
    const pwPrompt     = document.getElementById('pwPrompt');
    const pwInput      = document.getElementById('pwInput');
    let volumeUnlocked = false;
    let firstUnlock    = true;
    let mathAnswer     = null;

    function randTwoDigit() {
      return Math.floor(Math.random() * 90) + 10;
    }

    volumeSlider.addEventListener('mousedown', interceptVolume);
    volumeSlider.addEventListener('touchstart', interceptVolume, { passive: false });

    function interceptVolume(e) {
      if (volumeUnlocked) return;
      e.preventDefault();
      pwInput.value = '';
      pwInput.classList.remove('wrong');
      if (firstUnlock) {
        pwPrompt.textContent = "what's the magic word?";
        mathAnswer = null;
      } else {
        const a = randTwoDigit(), b = randTwoDigit();
        mathAnswer = a * b;
        pwPrompt.textContent = `what's ${a} x ${b}?`;
      }
      pwBox.classList.add('open');
      setTimeout(() => pwInput.focus(), 50);
    }

    let relockTimer = null;

    pwInput.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const val = pwInput.value.trim();
      const correct = firstUnlock
        ? val.toLowerCase() === 'please'
        : parseInt(val, 10) === mathAnswer;

      if (correct) {
        volumeUnlocked = true;
        firstUnlock    = false;
        pwBox.classList.remove('open');
        clearTimeout(relockTimer);
        relockTimer = setTimeout(() => {
          volumeUnlocked = false;
        }, 10000);
      } else {
        pwInput.classList.remove('wrong');
        void pwInput.offsetWidth;
        pwInput.classList.add('wrong');
        pwInput.value = '';
      }
    });

    function setVolume(v) {
      sfx.volume = v;
      volumeSlider.value = v;
    }

    setVolume(1);

    volumeSlider.addEventListener('input', () => {
      lastUserInput = Date.now();
      setVolume(parseFloat(volumeSlider.value));
    });

    let lastUserInput = 0;

    const hungryText = document.getElementById('hungryText');
    const cookieBtn  = document.getElementById('cookieBtn');
    let angryBarkInterval = null;
    let angryTimer = null;

    function scheduleAngry() {
      clearTimeout(angryTimer);
      const delay = (4 + Math.random() * 2) * 60 * 1000;
      angryTimer = setTimeout(startAngry, delay);
    }

    function startAngry() {
      isAngry = true;
      document.body.classList.add('angry');
      dog.classList.add('angry', 'visible');
      dog.classList.remove('fading');
      hungryText.classList.add('visible');
      cookieBtn.classList.add('visible');
      angryBarkInterval = setInterval(() => {
        sfx.currentTime = 0;
        sfx.play();
        flashDog();
      }, 1200);
    }

    function feedDog() {
      isAngry = false;
      document.body.classList.remove('angry');
      dog.classList.remove('angry', 'visible');
      dog.classList.add('fading');
      hungryText.classList.remove('visible');
      cookieBtn.classList.remove('visible');
      clearInterval(angryBarkInterval);
      scheduleAngry();
    }

    cookieBtn.addEventListener('click', feedDog);

    scheduleAngry();

    askBtn.addEventListener('click', () => {
      askBtn.disabled  = true;
      startBtn.disabled = true;
      setStatus('thinking...', true);

      setTimeout(() => {
        const twice = Math.random() < 0.5;
        if (twice) {
          triggerOnce(() => triggerOnce(() => {
            askBtn.disabled  = false;
            startBtn.disabled = !!intervalId;
            setStatus('idle');
          }));
        } else {
          triggerOnce(() => {
            askBtn.disabled  = false;
            startBtn.disabled = !!intervalId;
            setStatus('idle');
          });
        }
      }, 3000);
    });
  </script>

</body>
</html>
